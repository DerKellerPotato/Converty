[package]
name = "converty-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lopdf = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
which = "8"
