name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (clippy + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libdbus-1-dev ghostscript poppler-utils libreoffice-core libreoffice-writer \
            libreoffice-calc libreoffice-impress
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          CONVERTY_TEST_SOFFICE: "1"

  other:
    name: ${{ matrix.name }} (build + tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ghostscript and Poppler
        if: runner.os == 'macOS'
        run: brew install ghostscript poppler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
