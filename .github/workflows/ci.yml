name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (clippy + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libdbus-1-dev ghostscript poppler-utils libreoffice-core libreoffice-writer \
            libreoffice-calc libreoffice-impress ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          CONVERTY_TEST_SOFFICE: "1"

  other:
    name: ${{ matrix.name }} (build + tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ghostscript, Poppler and FFmpeg
        if: runner.os == 'macOS'
        run: brew install ghostscript poppler ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Launch smoke test (app must stay up for 15 s)
        shell: bash
        run: |
          cargo build -p converty
          exe=target/debug/converty
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" > smoke.log 2>&1 &
          pid=$!
          sleep 15
          if kill -0 $pid 2>/dev/null; then
            echo "Converty is running"; kill $pid || true
          else
            wait $pid; code=$?
            echo "Converty exited early with code $code"; cat smoke.log; exit 1
          fi
